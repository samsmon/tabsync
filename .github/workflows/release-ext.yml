# Push a tag like v0.2.0 -> builds the extension and attaches tabsync-v0.2.0.zip to a GitHub Release.
# Users download the zip, extract it, and "Load unpacked" in chrome://extensions.
name: Release extension

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ext
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ext/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Stamp manifest version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          node -e "const f='public/manifest.json',m=JSON.parse(require('fs').readFileSync(f));m.version='$v';require('fs').writeFileSync(f,JSON.stringify(m,null,2)+'\n')"
      - run: npm run build
      - name: Zip dist
        run: cd dist && zip -r "../tabsync-${GITHUB_REF_NAME}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: tabsync-${{ github.ref_name }}
          path: ext/tabsync-*.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ext/tabsync-*.zip
          generate_release_notes: true
